  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    if (!a || !a.length) return '';
    if (a.length < 3) return a[Math.floor(Math.random() * a.length)];
    const s = x => (typeof x === 'string' ? x : JSON.stringify(x));
    const sig = a.length + '|' + s(a[0]).slice(0, 30) + '|' + s(a[a.length - 1]).slice(0, 30);
    let h = 5381;
    for (let i = 0; i < sig.length; i++) h = ((h << 5) + h + sig.charCodeAt(i)) | 0;
    const k = (h >>> 0).toString(36);
    let used = PICKS[k] || [];
    let pool = a.map((_, i) => i).filter(i => used.indexOf(i) < 0);
    if (!pool.length) { used = used.slice(-Math.floor(a.length / 3)); pool = a.map((_, i) => i).filter(i => used.indexOf(i) < 0); }
    const i = pool[Math.floor(Math.random() * pool.length)];
    used.push(i); PICKS[k] = used;

  function donut(cats) {
    const total = cats.reduce((s, c) => s + c[1], 0);

      const a2 = a + frac * Math.PI * 2, large = frac > .5 ? 1 : 0;
      const p = (rad, ang) => [cx + rad * Math.cos(ang), cy + rad * Math.sin(ang)];
      const [x1, y1] = p(R, a), [x2, y2] = p(R, a2), [x3, y3] = p(r, a2), [x4, y4] = p(r, a);
      paths += `<path d="M${x1},${y1} A${R},${R} 0 ${large} 1 ${x2},${y2} L${x3},${y3} A${r},${r} 0 ${large} 0 ${x4},${y4} Z" fill="${PALETTE[i % PALETTE.length]}"><title>${esc(c[0])}: ${inr(c[1])}</title></path>`;

  function heat() {

  function stmtCard() {
    return `<div class="card" style="position:relative">${stk('🏦', 'Statement', 5, 'right:10px;top:-8px', 'yellow')}<h2>🏦 Bank / card statement upload</h2>

  function loadPdfJs() {
    if (PDFJS) return Promise.resolve(PDFJS);
    const base = 'https:' + '/' + '/cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    return new Promise((ok, bad) => {
      const s = document.createElement('script');
      s.src = base + 'pdf.min.js';
      s.onload = () => { PDFJS = window.pdfjsLib; PDFJS.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js'; ok(PDFJS); };
      s.onerror = () => bad(new Error('PDF reader load nahi hua — internet check karo 📶'));
      document.head.appendChild(s);
    });
  }
  async function pdfPages(buf, pw) {
    const lib = await loadPdfJs();
    let doc;
    try { doc = await lib.getDocument({ data: buf, password: pw || undefined }).promise; }
    catch (e) {
      if (e && e.name === 'PasswordException') throw new Error(pw ? 'PDF password galat hai 🔒 Dobara try karo' : 'Ye PDF password-protected hai 🔒 Upar password daalo (aksar DOB, customer ID ya PAN ka hissa hota hai)');
      throw e;
    }
    const pages = [];
    for (let p = 1; p <= Math.min(doc.numPages, 40); p++) {
      const page = await doc.getPage(p);
      const tc = await page.getTextContent();
      const rows = {};
      tc.items.forEach(it => { if (!it.str || !it.str.trim()) return; const y = Math.round(it.transform[5] / 3); (rows[y] = rows[y] || []).push({ x: it.transform[4], s: it.str }); });
      const lines = Object.keys(rows).map(Number).sort((a, b) => b - a).map(y => rows[y].sort((a, b) => a.x - b.x).map(o => o.s).join('  ').replace(/\s{3,}/g, '  ').trim());
      pages.push({ text: lines.join('\n'), page });
    }
    return pages;
  }
  async function pageToJpeg(page) {
    const vp = page.getViewport({ scale: 1.6 });
    const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    return c.toDataURL('image/jpeg', 0.8).split(',')[1];
  }
  /* run async jobs with a concurrency limit; the first job runs alone (it may create the account), first error stops the batch */
  async function pool(jobs, n) {
    if (!jobs.length) return;
    await jobs[0]();
    let next = 1;
    const worker = async () => { while (next < jobs.length) { const j = jobs[next++]; await j(); } };
    await Promise.all(Array.from({ length: Math.min(n, jobs.length) }, worker));
  }
  function txtB64(s) { return btoa(unescape(encodeURIComponent(s))); }
  async function importStatement(file) {
    if (!file) return;
    const acc = (document.getElementById('stAcc') || {}).value || '', pw = (document.getElementById('stPw') || {}).value || '';
    const row = { name: file.name, status: 'busy', msg: 'Statement padh rahe hain… ' + pick(D.lines.scanWait) };
    STMTLOG = [row].concat(STMTLOG).slice(0, 10); render();
    const upd = m => { row.msg = m; if ((MODE !== 'ca' && TAB === 'jaadu') || (MODE === 'ca' && CATAB === 'ca_imp')) render(); };
    const tot = { found: 0, added: 0, dup: 0, spent: 0, income: 0, account: acc, fix: null };
    const batchId = 'f' + Math.random().toString(36).slice(2, 8);   /* one undo for the whole file */
    const send = async (payload, label) => {
      upd('🪄 ' + label + ' — AI entries padh raha hai…');
      const r = await apiCall('import', Object.assign({ account: acc, statement: true, light: true, hint: 'bank/card statement', batch: batchId }, payload));
      const s = r.stats || {};
      ['found', 'added', 'dup', 'spent', 'income'].forEach(k => { tot[k] += s[k] || 0; });
      if (s.account) tot.account = s.account;
      if (r.fix) tot.fix = r.fix;
    };
    try {
      if (file.size > 15e6) throw new Error('File 15MB se badi hai 🐘');
      if (!(/pdf$/i.test(file.type) || /\.pdf$/i.test(file.name))) {
        await send({ name: file.name, mime: file.type, b64: await readB64(file) }, file.name);
      } else {
        upd('🔓 PDF khol rahe hain…');
        const pages = await pdfPages(new Uint8Array(await file.arrayBuffer()), pw);
        const chars = pages.reduce((n, p) => n + p.text.length, 0);
        if (chars > pages.length * 80) {
          const chunks = []; let cur = '', cnt = 0;
          pages.forEach((p, i) => {
            const t = '--- Page ' + (i + 1) + ' ---\n' + p.text + '\n';
            if (cur && (cur.length + t.length > 18000 || cnt >= 6)) { chunks.push(cur); cur = ''; cnt = 0; }
            cur += t; cnt++;
          });
          if (cur) chunks.push(cur);
          let doneN = 0;
          await pool(chunks.map((c, i) => () => send({ name: file.name + '.part' + (i + 1) + '.txt', mime: 'text/plain', b64: txtB64(c), hint: 'bank/card statement, part ' + (i + 1) + ' of ' + chunks.length },
            'Parts ' + chunks.length + ' (3 at a time)').then(() => upd('🪄 ' + (++doneN) + '/' + chunks.length + ' parts done…'))), 3);
        } else {
          const imgs = [];
          for (let i = 0; i < Math.min(pages.length, 12); i++) imgs.push({ i: i, b64: await pageToJpeg(pages[i].page) });
          let doneN = 0;
          await pool(imgs.map(x => () => send({ name: file.name + '.p' + (x.i + 1) + '.jpg', mime: 'image/jpeg', b64: x.b64, hint: 'scanned bank/card statement page ' + (x.i + 1) },
            'Pages ' + imgs.length + ' (3 at a time)').then(() => upd('🪄 ' + (++doneN) + '/' + imgs.length + ' pages done…'))), 3);
        }
      }
      applyRes(await apiCall('dashboard'));
      row.status = 'ok'; row.fix = tot.fix;
      row.msg = '🏦 ' + (tot.account || 'Statement') + '\n🔍 ' + tot.found + ' entries mili · ✅ ' + tot.added + ' naye · ♻️ ' + tot.dup + ' pehle se the\n🔻 Kharcha ' + inr(tot.spent) + ' · 🟢 Aaya ' + inr(tot.income);
      showSticker({ e: '🏦', t: 'Statement imported' }); rain(['📄', '✨', '💸'], 20);
    } catch (e) { row.status = 'err'; row.msg = errText(e); }
    render();
  }

  async function makeStory() {
    const w = D.wrapped[WMONTH], a = D.aura;
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1920;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 1080, 1920);
    g.addColorStop(0, '#7c3aed'); g.addColorStop(.55, '#ec4899'); g.addColorStop(1, '#f59e0b');
    x.fillStyle = g; x.fillRect(0, 0, 1080, 1920);
    x.globalAlpha = .13; x.fillStyle = '#fff';
    [[930, 220, 270], [110, 1480, 330], [1000, 1700, 190]].forEach(([cx, cy, r]) => { x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill(); });
    x.globalAlpha = 1;
    try { await Promise.all([document.fonts.load('90px Anton'), document.fonts.load('700 40px "Space Grotesk"')]); } catch (e) {}
    const fit = (txt, max, size, font) => { let s = size; do { x.font = font.replace('$', s); s -= 4; } while (x.measureText(txt).width > max && s > 20); };
    const rr = (X, Y, W, H, R) => { x.beginPath(); x.moveTo(X + R, Y); x.arcTo(X + W, Y, X + W, Y + H, R); x.arcTo(X + W, Y + H, X, Y + H, R); x.arcTo(X, Y + H, X, Y, R); x.arcTo(X, Y, X + W, Y, R); x.closePath(); };
    x.textAlign = 'center'; x.fillStyle = '#fff';
    x.font = '700 42px "Space Grotesk", sans-serif'; x.fillText('💸 KAHA GAYA MERA PAISA', 540, 140);
    fit('PAISA WRAPPED', 960, 128, '$px Anton, Impact, sans-serif'); x.fillText('PAISA WRAPPED', 540, 290);
    x.font = '600 46px "Space Grotesk", sans-serif'; x.fillText(w.label.toUpperCase(), 540, 360);
    x.fillStyle = 'rgba(255,255,255,.18)'; rr(70, 420, 940, 290, 44); x.fill();
    x.fillStyle = '#fff'; x.font = '600 40px "Space Grotesk", sans-serif'; x.fillText('Main hoon…', 540, 495);
    fit(w.persona.title, 880, 92, '$px Anton, Impact, sans-serif'); x.fillText(w.persona.title, 540, 610);
    fit(w.persona.line, 860, 36, '500 $px "Space Grotesk", sans-serif'); x.fillText(w.persona.line, 540, 670);
    const rows = [['🔻 Kharcha', inrS(w.expense)], ['👑 Top', w.top ? w.top.name + ' · ' + pct(w.top.share) : '—'],
      ['💘 Crush', w.topMerchant ? w.topMerchant.name + ' ×' + w.topMerchant.count : '—'], ['💰 Saved', w.savingsRate !== null ? pct(w.savingsRate) : '—'],
      ['🗿 No-spend days', String(w.noSpendDays)], [a.emoji + ' Aura', a.score.toLocaleString('en-IN') + ' · ' + a.tier]];
    rows.forEach((r, i) => {
      const y = 790 + i * 118;
      x.fillStyle = 'rgba(0,0,0,.16)'; rr(90, y - 70, 900, 98, 30); x.fill();
      x.fillStyle = '#fff'; x.textAlign = 'left'; x.font = '600 40px "Space Grotesk", sans-serif'; x.fillText(r[0], 130, y);
      x.textAlign = 'right'; fit(r[1], 520, 48, '$px Anton, Impact, sans-serif'); x.fillText(r[1], 950, y);
    });
    x.textAlign = 'center';
    const sticker = (e, t, cx, cy, rot) => {
      x.save(); x.translate(cx, cy); x.rotate(rot * Math.PI / 180);
      x.font = '150px sans-serif'; x.shadowColor = 'rgba(0,0,0,.3)'; x.shadowBlur = 20; x.fillText(e, 0, -10); x.shadowBlur = 0;
      x.font = '56px Anton, Impact, sans-serif'; const tw = x.measureText(t).width + 50;
      x.fillStyle = '#111'; rr(-tw / 2, 20, tw, 84, 20); x.fill(); x.strokeStyle = '#fff'; x.lineWidth = 6; x.stroke();
      x.fillStyle = '#fff'; x.fillText(t, 0, 84); x.restore();
    };
    const st = storyStickers(w);
    sticker(st[0][0], st[0][1], 300, 1590, -9);
    sticker(st[1][0], st[1][1], 780, 1660, 8);
    x.fillStyle = 'rgba(255,255,255,.9)'; x.font = '600 34px "Space Grotesk", sans-serif'; x.fillText('Apna bana → Kaha Gaya Mera Paisa 💸', 540, 1860);
    return c;
  }

    call('quick', { text: `split ${d.amount} ${d.note || ''} ${d.account} with ${ppl}` }, () => { e.target.reset(); rain(['🍕', '➗', '🤝'], 18); });
  }
  function udhaarSubmit(e) {
    e.preventDefault(); buzz();
    const d = formData(e.target);
    call('addTx', { type: d.type, amount: d.amount, to: d.to, account: D.defaultAccount }, () => e.target.reset());
  }
  /* ══════════ 👔 CA MODE — books of account, ITR, analytics (serious tone) ══════════ */
  function fa(n) { n = Number(n) || 0; const s = Math.abs(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); return n < -0.004 ? '(' + s + ')' : s; }
  function fdc(v) { v = Number(v) || 0; return Math.abs(v) < 0.005 ? '0.00' : fa(Math.abs(v)) + (v > 0 ? ' Dr' : ' Cr'); }
  function fpc(x) { return x === null || x === undefined || isNaN(x) ? '—' : (Math.round(x * 1000) / 10) + '%'; }
  function fd2(iso) { return new Date(iso).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }); }
  function r2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
  function ym(d) { d = new Date(d); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
  function ymd(d) { d = new Date(d); return ym(d) + '-' + ('0' + d.getDate()).slice(-2); }
  function nm(k) { return (CA && CA.report.names[k]) || k; }
  function cstat(l, v, cls) { return `<div class="card stat"><div class="l">${l}</div><div class="v mono ${cls || ''}">${v}</div></div>`; }
  function crow(l, v) { return `<div class="row"><span>${l}</span><b class="mono">${v}</b></div>`; }
  function caErr(e) { showVibe(errText(e), null, 'Error'); }

  function applyMode() {
    document.body.classList.toggle('ca', MODE === 'ca');
    const b = document.getElementById('modeBtn');
    if (b) { b.textContent = MODE === 'ca' ? '🎬' : '👔'; b.title = MODE === 'ca' ? 'Switch back to bakchodi mode' : 'CA mode — books, ITR, analytics'; }
    const v = document.getElementById('vibeBtn'); if (v) v.style.display = MODE === 'ca' ? 'none' : '';
    const l = document.getElementById('logoT'); if (l) l.textContent = MODE === 'ca' ? 'Books of Account' : 'Kaha Gaya Mera Paisa';
    const q = document.getElementById('q'); if (q) q.placeholder = MODE === 'ca' ? 'Quick entry — e.g. 2500 electricity hdfc' : '250 swiggy';
    renderQueuePill();
  }
  function toggleMode() {
    MODE = MODE === 'ca' ? 'fun' : 'ca'; store.set('mode', MODE); hideVibe(); applyMode(); renderNav(); render(); window.scrollTo({ top: 0 });
    if (MODE === 'fun') { if (D) { window.__greet = ''; render(); } if (D && VIBE) { showVibe(pick(D.lines.sections[TAB]), null, 'Bakchodi mode ON'); setTimeout(() => sticker('welcome'), 500); } }
    else showVibe('CA mode: books of account, tax computation and analytics. Tap 🎬 to switch back.', null, 'CA mode');
  }
  function loadCA() {
    if (CABUSY) return;
    CABUSY = true; CAERR = '';
    apiCall('ca', { fy: CAFY }).then(res => { CA = res.ca; CAFY = String(CA.fy); store.set('cafy', CAFY); CABUSY = false; if (MODE === 'ca') render(); })
      .catch(e => { CABUSY = false; CAERR = errText(e); if (MODE === 'ca') render(); });
  }
  function caReload() { CA = null; render(); }
  function caFy(y) { CAFY = String(y); store.set('cafy', CAFY); CA = null; LEDSEL = ''; DBF.month = ''; render(); }
  function refreshD() { apiCall('dashboard').then(res => { D = res.data; saveCache(); }).catch(() => {}); }

  function renderCA() {
    const g = document.getElementById('greet');
    if (!CA) {
      g.textContent = 'Books of account';
      document.getElementById('app').innerHTML = CAERR ? `<div class="loader"><b>⚠️</b>${esc(CAERR)}<br><button class="ghost" style="margin-top:10px" onclick="CAERR='';render()">Retry</button></div>`
        : '<div class="loader"><b>📒</b>Preparing books of account…</div>';
      if (!CAERR) loadCA();
      return;
    }
    const r = CA.report;
    g.textContent = r.label + ' (' + r.ay + ') · ' + (r.current ? 'as on ' + fd2(r.asOn) : 'year ended ' + fd2(r.to));
    const fn = { ca_tally: cTally, ca_over: cOver, ca_day: cDay, ca_led: cLed, ca_tb: cTB, ca_pl: cPL, ca_bs: cBS, ca_itr: cITR, ca_an: cAn, ca_bank: cBank, ca_imp: cImp }[CATAB] || cOver;
    document.getElementById('app').innerHTML = '<section class="on">' + caBar() + fn() + '</section>';
    if (CATAB === 'ca_tally') tAfter();
  }
  function caBar() {
    return `<div class="ca-bar"><select onchange="caFy(this.value)">${CA.fys.map(f => `<option value="${f.y}" ${f.y === CA.fy ? 'selected' : ''}>${f.label} · ${f.ay}</option>`).join('')}</select>
      <button class="ghost" onclick="caReload()">↻ Refresh</button><button class="ghost" onclick="caCSV()">⬇ CSV</button>
      <button class="ghost" onclick="caExport()">📤 Export to Google Sheets</button><button class="ghost" onclick="caPdf()">📄 PDF report</button>
      <span class="sub" style="margin-left:auto">${esc(CA_TITLES[CATAB] || '')}</span></div>`;
  }

  /* Overview */
  function cOver() {
    const r = CA.report, ie = r.ie, bs = r.bs, t = CA.itr, a = CA.analytics;
    const best = t.best === 'new' ? t.nw : t.old;
    const warn = t.warnings.slice();
    a.coverage.forEach(c => warn.push(c.account + ': no entries for ' + c.missing.join(', ') + ' — upload statements for these months.'));
    if (a.idle && a.idle.length) warn.push('No entries at all this FY in: ' + a.idle.join(', ') + '. Import their statements if they were used.');
    return `${munshiCard()}<div class="stats">
      ${cstat('Total income', fa(ie.totalIncome + ie.biz.receipts))}${cstat('Total expenditure', fa(ie.totalExpense + ie.biz.totalExp))}
      ${cstat('Surplus / (deficit)', fa(ie.surplus), ie.surplus < 0 ? 'neg' : 'pos')}${cstat('Net worth — closing', fa(bs.capital.close))}
      ${cstat('Net worth — opening', fa(bs.capital.open))}${cstat('Tax — ' + (t.best === 'new' ? 'new' : 'old') + ' regime', fa(best.tax))}
      ${cstat(t.payable.best >= 0 ? 'Tax payable' : 'Refund due', fa(Math.abs(t.payable.best)), t.payable.best > 0 ? 'neg' : 'pos')}${cstat('Suggested return', esc(t.form))}
    </div>
    <div class="grid">
      <div class="card"><h2>Books status</h2>
        ${crow('Entries in day book', r.stats.entries)}${crow('Re-classified manually', r.stats.manual)}${crow('Tax-tagged entries', r.stats.tagged)}
        ${crow('Suspense entries', r.stats.suspense + (r.stats.suspense ? ' · ' + fa(r.stats.suspenseAmt) : ''))}
        ${crow('Trial balance', Math.abs(r.tb.diff) < 0.01 ? '<span class="ok">Agreed ✓</span>' : '<span class="neg">Difference ' + fa(r.tb.diff) + '</span>')}
        ${crow('Balance sheet', Math.abs(bs.diff) < 0.01 ? '<span class="ok">Tallied ✓</span>' : '<span class="neg">Difference ' + fa(bs.diff) + '</span>')}</div>
      <div class="card"><h2>Income vs expenditure — month-wise</h2>${caMini(a.months)}</div>
      <div class="card"><h2>Points to review</h2>${warn.length ? warn.map(w => `<div class="row"><span>• ${esc(w)}</span></div>`).join('') : '<div class="sub">Nothing pending.</div>'}</div>
      <div class="card"><h2>Data health ${(CA.health || []).length ? '<span class="neg">(' + CA.health.length + ')</span>' : '<span class="ok">✓</span>'}</h2>
        ${(CA.health || []).length ? CA.health.slice(0, 15).map(h => `<div class="row"><span><b>Sheet row ${h.row}</b> — ${esc(h.issue)}<div class="sub">${esc(h.fix)}</div></span></div>`).join('') +
          (D && D.sheetUrl ? `<a class="ghost" style="display:inline-block;margin-top:8px;text-decoration:none" href="${esc(D.sheetUrl)}" target="_blank" rel="noopener">Open the Sheet to fix</a>` : '')
        : '<div class="sub">Every row has a valid date, amount, type and account. No likely duplicates.</div>'}</div>
    </div>`;
  }
  function caMini(ms) {
    const max = Math.max(1, ...ms.map(m => Math.max(m.inc, m.exp)));
    return `<div class="mini">${ms.map(m => `<div class="m" title="${esc(m.label)}: income ${fa(m.inc)}, expenditure ${fa(m.exp)}"><div class="p"><i style="height:${Math.max(0, m.inc) / max * 100}%;background:var(--green)"></i><i style="height:${Math.max(0, m.exp) / max * 100}%;background:var(--red)"></i></div>${esc(m.label.slice(0, 3))}</div>`).join('')}</div>
      <div class="sub" style="margin-top:6px"><span style="color:var(--green)">■</span> Income &nbsp; <span style="color:var(--red)">■</span> Expenditure</div>`;
  }

  /* Day Book */
  function dbSig(e) { return String(e.note || '').toLowerCase().replace(/[^a-z ]+/g, ' ').trim().split(/\s+/).slice(0, 2).join(' '); }
  function dbRows() {
    const q = DBF.q.toLowerCase().trim();
    return CA.report.dayBook.filter(e => (!q || (e.note + ' ' + nm(e.dr) + ' ' + nm(e.cr) + ' ' + e.amt + ' ' + e.id).toLowerCase().indexOf(q) >= 0)
      && (!DBF.head || e.dr === DBF.head || e.cr === DBF.head) && (!DBF.month || ym(e.date) === DBF.month)
      && (!DBF.flag || (DBF.flag === 'susp' ? e.key === 'BS:suspense' : DBF.flag === 'manual' ? e.manual : DBF.flag === 'tagged' ? !!e.tag : DBF.flag === 'misc' ? e.key === 'EXP:Other' : true)))
      .slice().reverse();
  }
  function cDay() {
    const heads = Object.keys(CA.report.names).sort((a, b) => nm(a).localeCompare(nm(b)));
    const months = [];
    for (let i = 0; i < 12; i++) { const d = new Date(CA.fy, 3 + i, 1); months.push([ym(d), d.toLocaleDateString('en-IN', { month: 'short', year: 'numeric' })]); }
    const flags = [['', 'All entries'], ['susp', 'Suspense only'], ['misc', 'Drawings — Other'], ['manual', 'Re-classified'], ['tagged', 'Tax-tagged']];
    return `<div class="card" style="margin-top:12px"><div class="filters">
      <input placeholder="Search narration / ledger / amount" value="${esc(DBF.q)}" oninput="DBF.q=this.value;DBN=150;caRefreshDay()">
      <select onchange="DBF.head=this.value;DBN=150;render()"><option value="">All ledgers</option>${heads.map(k => `<option value="${esc(k)}" ${k === DBF.head ? 'selected' : ''}>${esc(nm(k))}</option>`).join('')}</select>
      <select onchange="DBF.month=this.value;DBN=150;render()"><option value="">All months</option>${months.map(m => `<option value="${m[0]}" ${m[0] === DBF.month ? 'selected' : ''}>${m[1]}</option>`).join('')}</select>
      <select onchange="DBF.flag=this.value;DBN=150;render()">${flags.map(o => `<option value="${o[0]}" ${o[0] === DBF.flag ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></div>
      <label class="sub" style="display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto" ${CASIM ? 'checked' : ''} onchange="CASIM=this.checked"> Apply a change to every entry with a similar narration in this FY</label>
      <div id="dbList">${dbList(dbRows())}</div></div>`;
  }
  function caRefreshDay() { const el = document.getElementById('dbList'); if (el) el.innerHTML = dbList(dbRows()); }
  function dbList(rows) {
    const tot = rows.reduce((s, e) => s + e.amt, 0);
    return `<div class="sub" style="margin:8px 0">${rows.length} entries · total ${fa(tot)} · newest first</div>` + (rows.slice(0, DBN).map(dbRow).join('') || '<div class="empty">No entries for this filter.</div>')
      + (rows.length > DBN ? `<button class="ghost" style="margin-top:8px" onclick="DBN+=300;caRefreshDay()">Show more (${rows.length - DBN} left)</button>` : '');
  }
  function dbRow(e) {
    if (e.synthetic) {
      const why = e.split === 'interest' ? 'auto: interest part of the EMI (set by loan rate)' : e.split === 'gain' ? 'auto: sale above recorded cost → gain' : 'auto: ' + (e.note || 'adjustment');
      return `<div class="dbrow"><div class="l1"><div style="min-width:0"><div class="sub">${fd2(e.date)} · journal · <b>${esc(why)}</b></div>
        <div class="ellip"><b>Dr</b> ${esc(nm(e.dr))}</div><div class="ellip"><b>Cr</b> ${esc(nm(e.cr))}</div></div>
        <div class="mono" style="font-weight:700;white-space:nowrap">${fa(e.amt)}</div></div></div>`;
    }
    const opts = CA.options[e.type] || [];
    const autoLbl = e.manual ? 'Auto' : 'Auto — ' + nm(e.key);
    const head = e.type === 'transfer' ? `<select disabled><option>Contra — ${esc(nm(e.dr))}</option></select>`
      : `<select onchange="pickHead('${jsq(e.id)}',this)">${opts.filter(o => o[0] !== 'PERSON').map(o => `<option value="${esc(o[0])}" ${o[0] === (e.ov || '') ? 'selected' : ''}>${esc(o[0] ? o[1] : autoLbl)}</option>`).join('')}
        <optgroup label="Loans & advances — person">${(CA.people || []).map(p => `<option value="P:${esc(p.name)}" ${(e.ov || '') === 'P:' + p.name || (!e.manual && e.key === 'P:' + p.name && e.type !== 'gave' && e.type !== 'took') ? 'selected' : ''}>🤝 ${esc(p.name)}</option>`).join('')}
        <option value="__newp">➕ New person…</option></optgroup></select>`;
    const tagAuto = e.tagManual ? 'Tax tag: auto' : 'Tax tag: auto — ' + (e.tag || 'none');
    const tag = `<select onchange="caTag('${jsq(e.id)}','tag',this.value)"><option value="">${esc(tagAuto)}</option>${Object.keys(CA.tags).map(k => `<option value="${esc(k)}" ${k === (e.tg || '') ? 'selected' : ''}>${esc(CA.tags[k])}</option>`).join('')}</select>`;
    return `<div class="dbrow"><div class="l1"><div style="min-width:0"><div class="sub">${fd2(e.date)} · ${esc(e.type)} · #${esc(e.id)}${e.manual ? ' · <b>re-classified</b>' : ''}</div>
      <div class="ellip"><b>Dr</b> ${esc(nm(e.dr))}</div><div class="ellip"><b>Cr</b> ${esc(nm(e.cr))}</div>${e.note ? `<div class="sub ellip">${esc(e.note)}</div>` : ''}</div>
      <div class="mono" style="font-weight:700;white-space:nowrap">${fa(e.amt)}</div></div><div class="sel">${head}${tag}</div></div>`;
  }
  function pickHead(id, sel) {
    let v = sel.value;
    if (v === '__newp') {
      const e = CA.report.dayBook.find(x => x.id === id), guess = e ? String(e.note || '').replace(/[^A-Za-z ]+/g, ' ').replace(/\b(upi|neft|imps|to|from|by|transfer|paid|payment)\b/gi, ' ').replace(/\s+/g, ' ').trim() : '';
      const name = prompt('Friend\'s name for the loans & advances ledger:', guess.split(' ').slice(0, 2).join(' '));
      if (!name || !name.trim()) { render(); return; }
      v = 'P:' + name.trim();
    }
    caTag(id, 'ledger', v);
  }
  function caTag(id, field, val) {
    const e = CA.report.dayBook.find(x => x.id === id);
    let ids = [id];
    if (CASIM && e && dbSig(e)) { const s = dbSig(e); ids = CA.report.dayBook.filter(x => x.type === e.type && dbSig(x) === s).map(x => x.id); }
    const data = { ids: ids, fy: CA.fy }; data[field] = val;
    const n = ids.length + (ids.length > 1 ? ' entries' : ' entry');
    showVibe('Updating ' + n + '…', null, 'Saving');
    apiCall('caTag', data).then(res => { CA = res.ca; render(); showVibe(n + ' updated.', null, 'Saved'); }).catch(caErr);
  }

  /* Ledgers */
  function cLed() {
    const r = CA.report;
    if (LEDSEL && LEDALL) return ledAllView(LEDSEL);
    if (LEDSEL) { const l = r.ledgers.find(x => x.key === LEDSEL); if (l) return ledDetail(l); if (LEDSEL.indexOf('P:') === 0) { LEDALL = true; return ledAllView(LEDSEL); } LEDSEL = ''; }
    const by = {};
    r.ledgers.forEach(l => { (by[l.group] = by[l.group] || []).push(l); });
    const people = CA.people || [];
    const loansCard = people.length ? (() => {
      const rec = people.filter(p => p.value > 0).reduce((s, p) => s + p.value, 0), pay = people.filter(p => p.value < 0).reduce((s, p) => s - p.value, 0);
      return `<div class="card" style="margin-top:12px"><h2>🤝 Loans & Advances — control account</h2>
        <div class="stats" style="margin-top:4px">${cstat('Receivable (they owe you)', fa(rec), 'pos')}${cstat('Payable (you owe)', fa(pay), 'neg')}${cstat('Net', fdc(rec - pay))}</div>
        <div class="tbl-wrap" style="margin-top:8px"><table class="tbl"><tr><th>Sub-ledger (person)</th><th class="n">Entries</th><th class="n">Balance today</th><th>Status</th></tr>
        ${people.map(p => `<tr class="click" onclick="openLedger('P:${jsq(p.name)}')"><td><b>${esc(p.name)}</b>${p.last ? `<div class="sub">last ${fd2(p.last)}</div>` : ''}</td><td class="n">${p.entries}</td>
          <td class="n">${fdc(p.value)}</td><td class="sub">${Math.abs(p.value) < 0.01 ? 'Settled' : p.value > 0 ? 'Owes you' : 'You owe'}</td></tr>`).join('')}
        <tr class="tot"><td>Total</td><td></td><td class="n">${fdc(rec - pay)}</td><td></td></tr></table></div>
        <div class="hint">Tap a person for every transaction with them, across all years. Give a UPI to a friend this head from the Day Book ("Loans & advances → name") and it lands in their ledger.</div></div>`;
    })() : '';
    return loansCard + Object.keys(GROUP_LABEL).filter(g => by[g] && !(g === 'person' && people.length)).map(g => `<div class="card" style="margin-top:12px"><h2>${GROUP_LABEL[g]}</h2><div class="tbl-wrap"><table class="tbl">
      <tr><th>Ledger</th><th class="n">Opening</th><th class="n">Debit</th><th class="n">Credit</th><th class="n">Closing</th></tr>
      ${by[g].map(l => `<tr class="click" onclick="openLedger('${jsq(l.key)}')"><td>${esc(l.name)}</td><td class="n">${l.real ? fdc(l.open) : '—'}</td><td class="n">${fa(l.dr)}</td><td class="n">${fa(l.cr)}</td><td class="n">${fdc(l.real ? l.close : l.dr - l.cr)}</td></tr>`).join('')}
      </table></div></div>`).join('') + '<div class="hint">Tap a ledger for the full account with running balance and opening-balance setting.</div>';
  }
  function ledDetail(l) {
    const r = CA.report;
    let b = l.real ? l.open : 0;
    const rows = r.dayBook.filter(e => e.dr === l.key || e.cr === l.key).map(e => {
      const isDr = e.dr === l.key;
      b = r2(b + (isDr ? e.amt : -e.amt));
      return `<tr><td style="white-space:nowrap">${fd2(e.date)}</td><td>${isDr ? 'To' : 'By'} ${esc(nm(isDr ? e.cr : e.dr))}${e.note ? `<div class="sub">${esc(e.note)}</div>` : ''}</td><td class="n">${isDr ? fa(e.amt) : ''}</td><td class="n">${isDr ? '' : fa(e.amt)}</td><td class="n">${fdc(b)}</td></tr>`;
    }).join('');
    const canOpen = l.real && (l.key.indexOf('A:') === 0 || l.key === 'BS:invest' || l.key === 'BS:vda' || l.key.indexOf('P:') === 0);
    const natural = l.group === 'liability' ? -l.open : l.open;
    const what = l.group === 'liability' ? 'amount outstanding' : l.group === 'person' ? 'positive = they owe you' : 'balance';
    const isLoan = l.kind === 'loan', rate = (CA.loanRates || {})[l.key.slice(2)] || '';
    return `<div class="card" style="margin-top:12px"><button class="ghost" onclick="LEDSEL='';render()">← All ledgers</button>
      ${l.real ? `<div class="seg" style="float:right"><button class="on">${esc(r.label)}</button><button onclick="LEDALL=true;render()">All years</button></div>` : ''}
      <h3 style="margin-top:10px">${esc(l.name)}</h3><div class="sub">${GROUP_LABEL[l.group] || ''} · ${esc(r.label)}</div>
      ${isLoan ? `<div class="flex" style="margin-top:10px;flex-wrap:wrap"><span class="sub">Interest rate (% p.a.) — EMIs are split into principal (reduces this loan${/home|housing/i.test(l.name) ? ', 80C' : ''}) and interest${/home|housing/i.test(l.name) ? ' (24(b))' : ''}:</span>
        <input id="lrate" type="number" step="0.01" style="width:110px" value="${rate}"><button class="ghost" onclick="caLoan('${jsq(l.key)}')">Save rate</button></div>` : ''}
      ${canOpen ? `<div class="flex" style="margin-top:10px;flex-wrap:wrap"><span class="sub">Opening as on 1 Apr ${CA.fy} (${what}):</span>
        <input id="opv" type="number" step="0.01" style="width:170px" value="${r2(natural)}"><button class="ghost" onclick="caOpening('${jsq(l.key)}')">Set opening</button></div>
        <div class="hint">Enter the opening balance printed on the statement. Earlier entries stay; the base opening is adjusted so this FY starts at this figure.</div>` : ''}
      <div class="tbl-wrap" style="margin-top:10px"><table class="tbl"><tr><th>Date</th><th>Particulars</th><th class="n">Debit</th><th class="n">Credit</th><th class="n">Balance</th></tr>
      <tr class="sec"><td></td><td>Opening balance</td><td></td><td></td><td class="n">${l.real ? fdc(l.open) : '—'}</td></tr>${rows}
      <tr class="tot"><td></td><td>Closing balance</td><td class="n">${fa(l.dr)}</td><td class="n">${fa(l.cr)}</td><td class="n">${fdc(l.real ? l.close : l.dr - l.cr)}</td></tr></table></div></div>`;
  }
  /* Ledger across all years (e.g. a friend's loan account from day one) */
  let LEDALL = false;
  const LEDCACHE = {};
  function openLedger(key) { LEDSEL = key; LEDALL = key.indexOf('P:') === 0; delete LEDCACHE[key]; render(); window.scrollTo({ top: 0 }); }
  function loadLedgerAll(key, cb) { apiCall('ledgerAll', { key: key }).then(res => { LEDCACHE[key] = res.ledger; cb && cb(); }).catch(e => { LEDCACHE[key] = { error: errText(e) }; cb && cb(); }); }
  function ledAllView(key) {
    const L = LEDCACHE[key];
    if (!L) { loadLedgerAll(key, () => { if (MODE === 'ca' && CATAB === 'ca_led' && LEDSEL === key) render(); }); return '<div class="loader"><b>📒</b>Opening the full ledger…</div>'; }
    if (L.error) return `<div class="card" style="margin-top:12px"><button class="ghost" onclick="LEDSEL='';LEDALL=false;render()">← All ledgers</button><div class="sub neg" style="margin-top:8px">${esc(L.error)}</div></div>`;
    const inFy = (CA.report.ledgers || []).some(l => l.key === L.key);
    return `<div class="card" style="margin-top:12px"><button class="ghost" onclick="LEDSEL='';LEDALL=false;render()">← All ledgers</button>
      ${inFy ? `<div class="seg" style="float:right"><button onclick="LEDALL=false;render()">${esc(CA.report.label)}</button><button class="on">All years</button></div>` : ''}
      <h3 style="margin-top:10px">${esc(L.person || L.name)}</h3><div class="sub">${L.person ? 'Loans & advances — sub-ledger · every transaction, all years' : esc(GROUP_LABEL[L.group] || '') + ' · all years'}</div>
      ${ledgerStatement(L)}</div>`;
  }
  /* shared by CA mode and the Dost tab */
  function ledgerStatement(L) {
    const owes = L.close > 0.004 ? (L.person ? esc(L.person) + ' owes you' : 'Debit balance') : L.close < -0.004 ? (L.person ? 'You owe ' + esc(L.person) : 'Credit balance') : 'Settled';
    const hdr = L.person ? ['You gave / paid', 'You got back'] : ['Debit', 'Credit'];
    let lastFy = null;
    return `<div class="stats" style="margin-top:8px">${cstat(hdr[0], fa(L.dr))}${cstat(hdr[1], fa(L.cr))}${cstat(owes, fa(Math.abs(L.close)), L.close > 0 ? 'pos' : L.close < 0 ? 'neg' : '')}</div>
      ${L.years.length > 1 ? `<div class="tbl-wrap" style="margin-top:8px"><table class="tbl"><tr><th>Year</th><th class="n">${hdr[0]}</th><th class="n">${hdr[1]}</th><th class="n">Closing</th></tr>
        ${L.years.map(y => `<tr><td style="white-space:nowrap">${esc(y.label)}</td><td class="n">${fa(y.dr)}</td><td class="n">${fa(y.cr)}</td><td class="n">${fdc(y.close)}</td></tr>`).join('')}</table></div>` : ''}
      <div class="tbl-wrap" style="margin-top:10px"><table class="tbl"><tr><th>Date</th><th>Particulars</th><th class="n">${hdr[0]}</th><th class="n">${hdr[1]}</th><th class="n">Balance</th></tr>
      <tr class="sec"><td></td><td>Opening balance</td><td></td><td></td><td class="n">${fdc(L.open)}</td></tr>
      ${L.rows.map(x => { const sep = x.fy !== lastFy ? `<tr class="sec"><td colspan="5">${esc(fyLabelC(x.fy))}</td></tr>` : ''; lastFy = x.fy;
        return sep + `<tr><td style="white-space:nowrap">${fd2(x.date)}</td><td>${x.dr ? 'To' : 'By'} ${esc(x.part)}${x.note ? `<div class="sub">${esc(x.note)}${x.via ? ' · via ' + esc(x.via) : ''}</div>` : ''}</td>
          <td class="n">${x.dr ? fa(x.dr) : ''}</td><td class="n">${x.cr ? fa(x.cr) : ''}</td><td class="n">${fdc(x.bal)}</td></tr>`; }).join('') || '<tr><td colspan="5" class="sub">No transactions yet</td></tr>'}
      <tr class="tot"><td></td><td>Closing balance</td><td class="n">${fa(L.dr)}</td><td class="n">${fa(L.cr)}</td><td class="n">${fdc(L.close)}</td></tr></table></div>`;
  }
  function fyLabelC(y) { return 'FY ' + y + '-' + String(y + 1).slice(-2); }
  function caLoan(key) {
    const v = Number(document.getElementById('lrate').value);
    apiCall('caLoan', { key: key, rate: v, fy: CA.fy }).then(res => { CA = res.ca; render(); showVibe(res.msg, null, 'Saved'); }).catch(caErr);
  }
  /* Personal assets (Schedule AL): property, gold, vehicles… held at cost / value */
  function assetsCard() {
    const list = (CA.report.ledgers || []).filter(l => l.group === 'passet');
    return `<div class="card" style="margin-top:12px"><h2>Personal assets — at cost / value</h2>
      ${list.length ? `<table class="tbl">${list.map(l => `<tr><td>${esc(l.name)}</td><td class="n">${fa(l.close)}</td><td style="width:30px"><a href="#" onclick="caAssetDel('${jsq(l.key)}');return false">✕</a></td></tr>`).join('')}</table>` : '<div class="sub">None yet — add property, jewellery, vehicles, PF / PPF balances, insurance surrender value…</div>'}
      <div class="setf" style="margin-top:8px"><label class="sub">Type<select id="paKind">${['Land / building', 'Gold & jewellery', 'Vehicle', 'PF / PPF / NPS', 'Insurance', 'Shares (demat)', 'Other'].map(x => `<option>${x}</option>`).join('')}</select></label>
        <label class="sub">Name / description<input id="paName" placeholder="Flat at Pune" autocomplete="off"></label>
        <label class="sub">Value (₹, cost)<input id="paVal" type="number" step="0.01"></label></div>
      <button class="ghost" style="margin-top:8px" onclick="caAssetAdd()">Add asset</button><div class="hint">Goes into the balance sheet, net worth and Schedule AL.</div></div>`;
  }
  function caAssetAdd() {
    const d = { kind: document.getElementById('paKind').value.replace(/[^A-Za-z &]/g, '').trim(), name: document.getElementById('paName').value.trim(), value: Number(document.getElementById('paVal').value), fy: CA.fy };
    apiCall('caAsset', d).then(res => { CA = res.ca; render(); showVibe(res.msg, null, 'Saved'); refreshD(); }).catch(caErr);
  }
  function caAssetDel(key) {
    const p = key.split(':');
    apiCall('caAsset', { kind: p[2], name: p.slice(3).join(':'), remove: true, fy: CA.fy }).then(res => { CA = res.ca; render(); refreshD(); }).catch(caErr);
  }
  function caOpening(key) {
    const v = Number(document.getElementById('opv').value);
    if (isNaN(v)) return showVibe('Enter a number.', null, 'Error');
    apiCall('caOpening', { key: key, fy: CA.fy, value: v }).then(res => { CA = res.ca; render(); showVibe('Opening balance updated.', null, 'Saved'); refreshD(); }).catch(caErr);
  }

  /* Trial balance */
  function cTB() {
    const t = CA.report.tb, r = CA.report;
    return `<div class="card" style="margin-top:12px"><h2>Trial balance — ${esc(r.label)}${r.current ? ' (as on ' + fd2(r.asOn) + ')' : ''}</h2><div class="tbl-wrap"><table class="tbl">
      <tr><th>Ledger</th><th>Group</th><th class="n">Debit</th><th class="n">Credit</th></tr>
      ${t.rows.map(x => `<tr><td>${esc(x.name)}</td><td class="sub">${esc(GROUP_LABEL[x.group] || x.group)}</td><td class="n">${x.dr ? fa(x.dr) : ''}</td><td class="n">${x.cr ? fa(x.cr) : ''}</td></tr>`).join('')}
      <tr class="tot"><td>Total</td><td></td><td class="n">${fa(t.dr)}</td><td class="n">${fa(t.cr)}</td></tr></table></div>
      <div class="hint">${Math.abs(t.diff) < 0.01 ? '<span class="ok">Trial balance agrees ✓</span>' : '<span class="neg">Difference ' + fa(t.diff) + '</span>'} · Real accounts at closing balance, nominal accounts at totals for the year, capital at opening.</div></div>`;
  }

  /* Income & expenditure / P&L */
  /* Classic (horizontal / T-form) statements */
  function viewToggle() {
    return `<div class="ca-bar"><div class="seg"><button class="${CLASSIC ? 'on' : ''}" onclick="setClassic(true)">Classic (T-form)</button><button class="${CLASSIC ? '' : 'on'}" onclick="setClassic(false)">Vertical</button></div></div>`;
  }
  function setClassic(on) { CLASSIC = on; store.set('classic', on ? 'on' : 'off'); render(); }
  function pairRows(a, b) { const n = Math.max(a.length, b.length), o = []; for (let i = 0; i < n; i++) o.push([a[i] || null, b[i] || null]); return o; }
  function classicBS() {
    const bs = CA.report.bs, L = [], A = [];
    L.push(['Capital Account', '', '', 'h'], ['Opening balance', bs.capital.open, '', 'i'], ['Add: Surplus / (Deficit) for the year', bs.capital.surplus, '', 'i'], ['', '', bs.capital.close, 's']);
    const side = (rows, out) => { const by = {}; rows.forEach(x => { (by[x.sec] = by[x.sec] || []).push(x); });
      Object.keys(by).forEach(s => { out.push([s, '', '', 'h']); by[s].forEach(x => out.push([x.name, x.amt, '', 'i', x.key])); out.push(['', '', by[s].reduce((a, x) => a + x.amt, 0), 's']); }); };
    side(bs.liabilities, L); side(bs.assets, A);
    const td = x => !x ? '<td></td><td></td><td></td>' : `<td class="${x[3] === 'h' ? 'hd' : ''}" ${x[4] ? `style="padding-left:16px;cursor:pointer" onclick="LEDSEL='${jsq(x[4])}';go('ca_led')"` : x[3] === 'i' ? 'style="padding-left:16px"' : ''}>${esc(x[0])}</td><td class="n">${x[1] === '' ? '' : fa(x[1])}</td><td class="n ${x[3] === 's' ? 'b' : ''}">${x[2] === '' ? '' : fa(x[2])}</td>`;
    return `<div class="card" style="margin-top:12px"><h2>Balance Sheet as at ${fd2(CA.report.asOn)}</h2>
      <div class="tbl-wrap"><table class="tbl classic"><tr><th>Liabilities</th><th class="n">₹</th><th class="n">₹</th><th>Assets</th><th class="n">₹</th><th class="n">₹</th></tr>
      ${pairRows(L, A).map(p => `<tr>${td(p[0])}${td(p[1])}</tr>`).join('')}
      <tr class="tot"><td>Total</td><td></td><td class="n">${fa(bs.totalLiab)}</td><td>Total</td><td></td><td class="n">${fa(bs.totalAssets)}</td></tr></table></div>
      <div class="hint">${Math.abs(bs.diff) < 0.01 ? '<span class="ok">Tallied ✓</span>' : '<span class="neg">Difference ' + fa(bs.diff) + '</span>'} · tap a ledger to open it</div></div>`;
  }
  function classicIE() {
    const ie = CA.report.ie, p = ie.biz.profit, Dr = ie.expense.map(x => ['To ' + x.name, x.amt]), Cr = ie.income.map(x => ['By ' + x.name, x.amt]);
    if (p > 0) Cr.push(['By Net profit from business / profession', p]); else if (p < 0) Dr.push(['To Net loss from business / profession', -p]);
    if (ie.surplus > 0) Dr.push(['To Surplus transferred to Capital A/c', ie.surplus]); else if (ie.surplus < 0) Cr.push(['By Deficit transferred to Capital A/c', -ie.surplus]);
    const tbl = (dr, cr, title) => `<div class="card" style="margin-top:12px"><h2>${title}</h2><div class="tbl-wrap"><table class="tbl classic"><tr><th>Dr — Particulars</th><th class="n">₹</th><th>Cr — Particulars</th><th class="n">₹</th></tr>
      ${pairRows(dr, cr).map(x => `<tr><td>${x[0] ? esc(x[0][0]) : ''}</td><td class="n">${x[0] ? fa(x[0][1]) : ''}</td><td>${x[1] ? esc(x[1][0]) : ''}</td><td class="n">${x[1] ? fa(x[1][1]) : ''}</td></tr>`).join('')}
      <tr class="tot"><td>Total</td><td class="n">${fa(dr.reduce((s, x) => s + x[1], 0))}</td><td>Total</td><td class="n">${fa(cr.reduce((s, x) => s + x[1], 0))}</td></tr></table></div></div>`;
    let h = '';
    if (ie.biz.receipts || ie.biz.totalExp) {
      const bd = ie.biz.expenses.map(x => ['To ' + x.name, x.amt]), bc = [['By Gross receipts', ie.biz.receipts]];
      if (p >= 0) bd.push(['To Net profit c/d', p]); else bc.push(['By Net loss c/d', -p]);
      h += tbl(bd, bc, 'Profit & Loss Account — business / profession, year ended ' + fd2(CA.report.to));
    }
    return h + tbl(Dr, Cr, 'Income & Expenditure Account for the year ended ' + fd2(CA.report.to));
  }
  function cPL() { return viewToggle() + (CLASSIC ? classicIE() : cPLV()); }
  function cBS() { return viewToggle() + (CLASSIC ? classicBS() : cBSV()) + assetsCard(); }

  function cPLV() {
    const ie = CA.report.ie, inv = CA.analytics.totals.inv, hasBiz = ie.biz.receipts || ie.biz.totalExp;
    const line = (n, a, cls) => `<tr class="${cls || ''}"><td>${n}</td><td class="n">${fa(a)}</td></tr>`;
    let h = '';
    if (hasBiz) h += `<div class="card" style="margin-top:12px"><h2>A. Profit & loss — business / profession</h2><table class="tbl">${line('Gross receipts', ie.biz.receipts)}
      ${ie.biz.expenses.map(x => line('Less: ' + esc(x.name), x.amt)).join('')}${line('Net profit / (loss)', ie.biz.profit, 'tot')}</table></div>`;
    h += `<div class="bs2"><div class="card"><h2>${hasBiz ? 'B. ' : ''}Income</h2><table class="tbl">${ie.income.map(x => line(esc(x.name), x.amt)).join('') || '<tr><td class="sub">No income recorded</td><td></td></tr>'}${line('Total income', ie.totalIncome, 'tot')}</table></div>
      <div class="card"><h2>${hasBiz ? 'C. ' : ''}Expenditure</h2><table class="tbl">${ie.expense.map(x => line(esc(x.name), x.amt)).join('') || '<tr><td class="sub">No expenditure recorded</td><td></td></tr>'}${line('Total expenditure', ie.totalExpense, 'tot')}</table></div></div>
      <div class="card" style="margin-top:12px"><table class="tbl">${hasBiz ? line('Net profit from business', ie.biz.profit) : ''}${line('Personal surplus / (deficit)', ie.personalSurplus)}${line('Surplus / (deficit) carried to capital account', ie.surplus, 'tot')}</table>
      ${inv ? `<div class="hint">Investments of ${fa(inv)} made during the year are shown in the balance sheet at cost, not as expenditure.</div>` : ''}</div>`;
    return h;
  }

  /* Balance sheet */
  function cBSV() {
    const bs = CA.report.bs, r = CA.report;
    const sec = rows => { const by = {}; rows.forEach(x => { (by[x.sec] = by[x.sec] || []).push(x); });
      return Object.keys(by).map(s => `<tr class="sec"><td>${esc(s)}</td><td class="n">${fa(by[s].reduce((a, x) => a + x.amt, 0))}</td></tr>` +
        by[s].map(x => `<tr class="click" onclick="LEDSEL='${jsq(x.key)}';go('ca_led')"><td style="padding-left:18px">${esc(x.name)}</td><td class="n">${fa(x.amt)}</td></tr>`).join('')).join(''); };
    return `<div class="card" style="margin-top:12px"><h2>Statement of affairs as on ${fd2(r.asOn)}</h2><div>${Math.abs(bs.diff) < 0.01 ? '<span class="ok">Tallied ✓ Assets = Liabilities + Capital</span>' : '<span class="neg">Difference ' + fa(bs.diff) + '</span>'}</div></div>
    <div class="bs2"><div class="card"><h2>Liabilities & capital</h2><table class="tbl">
      <tr class="sec"><td>Capital account</td><td class="n">${fa(bs.capital.close)}</td></tr>
      <tr><td style="padding-left:18px">Opening balance (net worth on 1 Apr ${CA.fy})</td><td class="n">${fa(bs.capital.open)}</td></tr>
      <tr><td style="padding-left:18px">Add: surplus / (deficit) for the year</td><td class="n">${fa(bs.capital.surplus)}</td></tr>
      ${sec(bs.liabilities)}<tr class="tot"><td>Total</td><td class="n">${fa(bs.totalLiab)}</td></tr></table></div>
    <div class="card"><h2>Assets</h2><table class="tbl">${sec(bs.assets) || '<tr><td class="sub">No assets recorded</td><td></td></tr>'}<tr class="tot"><td>Total</td><td class="n">${fa(bs.totalAssets)}</td></tr></table></div></div>`;
  }

  /* ITR / tax */
  function slabTxt(s) { return s.map((x, i) => (x[0] === null ? 'Above ' + fa(s[i - 1][0]) : (i ? fa(s[i - 1][0]) : '0') + ' – ' + fa(x[0])) + ': ' + Math.round(x[1] * 100) + '%').join('<br>'); }
  function pctS(x) { return (Math.round(x * 1000) / 10) + '%'; }
  function cITR() {
    const t = CA.itr, o = t.old, n = t.nw, best = t.best === 'new' ? n : o;
    const cmp = (lbl, a, b, cls) => `<tr class="${cls || ''}"><td>${lbl}</td><td class="n">${fa(a)}</td>${n ? `<td class="n">${fa(b)}</td>` : ''}</tr>`;
    const S = t.settings, A = t.auto, tg = A.tags || {};
    const hint = { grossSalary: A.salaryCredits + (Number(S.tdsSalary) || 0), d80C: tg['80C'], d80CCD1B: tg['80CCD1B'], d80D: tg['80D'], d80E: tg['80E'], d80G: tg['80G'],
      advTax: tg.ADVTAX, bizIncome: t.heads.biz.income, hpIncome: t.heads.hp.income };
    const sel = (f, opts, cur) => `<label class="sub">${esc(f[1].split(':')[0])}<select data-f="${f[0]}">${opts.map(x => `<option value="${x[0]}" ${x[0] === cur ? 'selected' : ''}>${x[1]}</option>`).join('')}</select></label>`;
    const field = f => {
      if (f[0] === 'presumptive') return sel(f, [['actual', 'Actual (books of account)'], ['44AD', '44AD — business, 6% of digital receipts'], ['44ADA', '44ADA — profession, 50% of receipts']], S.presumptive || 'actual');
      if (f[0] === 'age') return sel(f, [['below60', 'Below 60'], ['60to80', '60 to 80 (senior citizen)'], ['above80', '80 and above (super senior)']], S.age || 'below60');
      return `<label class="sub">${esc(f[1])}<input data-f="${f[0]}" type="number" step="0.01" value="${S[f[0]] === undefined ? '' : S[f[0]]}" placeholder="${hint[f[0]] ? 'auto: ' + fa(hint[f[0]]) : ''}"></label>`;
    };
    return `<div class="card" style="margin-top:12px"><h2>Recommendation — ${esc(t.label)} (${esc(t.ay)})</h2>
      <div style="font-size:18px;font-weight:700">${n ? (t.best === 'new' ? 'New regime (sec 115BAC)' : 'Old regime') : 'Old regime'} — total tax ${fa(best.tax)}</div>
      ${n && t.saving ? `<div class="sub">Lower than the ${t.best === 'new' ? 'old' : 'new'} regime by ${fa(t.saving)}.</div>` : ''}
      ${crow('Taxes already paid (TDS + advance / self-assessment)', fa(t.paid.total))}
      <div class="row"><span>${t.payable.best >= 0 ? 'Balance tax payable' : 'Refund due'}</span><b class="mono ${t.payable.best > 0 ? 'neg' : 'pos'}">${fa(Math.abs(t.payable.best))}</b></div>
      <div class="row"><span>Return form</span><b>${esc(t.form)}</b></div><div class="sub">${t.reasons.map(esc).join('<br>')}</div></div>
    <div class="card" style="margin-top:12px"><h2>Computation of total income & tax</h2><div class="tbl-wrap"><table class="tbl">
      <tr><th>Particulars</th><th class="n">Old regime</th>${n ? '<th class="n">New regime</th>' : ''}</tr>
      ${cmp('Salary (net of exemptions & standard deduction)', t.heads.salary.netOld, t.heads.salary.netNew)}
      ${cmp('Gross total income', o.gti, n && n.gti)}${cmp('Less: deductions (Chapter VI-A)', o.ded, n && n.ded)}${cmp('Income at normal rates', o.normal, n && n.normal)}
      ${cmp('Income at special rates (capital gains)', o.special, n && n.special)}${cmp('Tax at normal rates', o.slab, n && n.slab)}${cmp('Tax at special rates', o.spTax, n && n.spTax)}
      ${cmp('Less: rebate u/s 87A / marginal relief', o.rebate, n && n.rebate)}${cmp('Surcharge', o.surcharge, n && n.surcharge)}${cmp('Health & education cess @ 4%', o.cess, n && n.cess)}
      ${cmp('Total tax liability', o.tax, n && n.tax, 'tot')}${cmp('Less: taxes paid', t.paid.total, t.paid.total)}${cmp('Payable / (refund)', t.payable.old, t.payable.nw, 'tot')}
    </table></div></div>
    <div class="grid"><div class="card"><h2>Schedule-wise figures for the ITR utility</h2><table class="tbl">${t.schedule.map(x => `<tr><td><div class="sub">${esc(x[0])}</div>${esc(x[1])}</td><td class="n">${typeof x[2] === 'number' ? fa(x[2]) : esc(x[2])}</td></tr>`).join('') || '<tr><td class="sub">No taxable figures yet</td><td></td></tr>'}</table></div>
      <div class="card"><h2>Deductions — old regime (after limits)</h2><table class="tbl">${Object.keys(t.ded).map(k => `<tr><td>${esc(k)}</td><td class="n">${fa(t.ded[k])}</td></tr>`).join('')}<tr class="tot"><td>Total</td><td class="n">${fa(t.dedTotal)}</td></tr></table>
        <div class="hint">Auto amounts come from tax-tagged Day Book entries; settings below override them. 80G is taken at 50% of the qualifying amount.</div></div>
      <div class="card"><h2>Rates applied</h2><div class="sub"><b>Old regime</b> (${esc(t.age)}) — standard deduction ${fa(t.rules.old.sd)}, 87A rebate up to income ${fa(t.rules.old.rebateLimit)}<br>${slabTxt(t.rules.old.slabs)}</div>
        ${t.rules.nw ? `<div class="sub" style="margin-top:8px"><b>New regime</b> — standard deduction ${fa(t.rules.nw.sd)}, 87A rebate up to income ${fa(t.rules.nw.rebateLimit)} (max ${fa(t.rules.nw.rebateMax)})<br>${slabTxt(t.rules.nw.slabs)}</div>` : ''}
        <div class="sub" style="margin-top:8px">Capital gains: 111A ${pctS(t.rules.cg.stcg)} · 112A ${pctS(t.rules.cg.ltcg)} above ${fa(t.rules.cg.ltcgExempt)} · 112 ${pctS(t.rules.cg.ltcgOther)}${t.rules.assumed ? '<br><b>Rates for this year are assumed — verify.</b>' : ''}</div></div></div>
    ${t.warnings.length ? `<div class="card" style="margin-top:12px"><h2>Points to check</h2>${t.warnings.map(w => `<div class="row"><span>• ${esc(w)}</span></div>`).join('')}</div>` : ''}
    ${t.advance && t.advance.applicable ? `<div class="card" style="margin-top:12px"><h2>Advance tax schedule — estimated liability ${fa(t.advance.liability)}</h2><div class="tbl-wrap"><table class="tbl">
      <tr><th>Due by</th><th class="n">Cumulative</th><th class="n">Required</th><th class="n">Paid</th><th class="n">Shortfall</th></tr>
      ${t.advance.rows.map(r => `<tr><td>${fd2(r.due)}</td><td class="n">${Math.round(r.pct * 100)}%</td><td class="n">${fa(r.required)}</td><td class="n">${fa(r.paid)}</td><td class="n ${r.shortfall > 0 ? 'neg' : 'pos'}">${fa(r.shortfall)}</td></tr>`).join('')}</table></div>
      <div class="hint">Payments tagged "Advance / self-assessment tax" in the Day Book count here. Interest u/s 234B / 234C applies on shortfalls. The bot reminds you on the 10th of Jun, Sep, Dec and Mar.</div></div>`
      : `<div class="card" style="margin-top:12px"><h2>Advance tax</h2><div class="sub">${t.advance && t.advance.exempt ? 'Not required — senior citizen without business income (sec 207).' : 'Not required — estimated liability after TDS is below ₹10,000.'}</div></div>`}
    <div class="card" style="margin-top:12px"><h2>Bank accounts for the return</h2>${(t.banks || []).length ? `<table class="tbl"><tr><th>Bank</th><th>IFSC</th><th>Account</th><th>Refund</th></tr>${t.banks.map(b => `<tr><td>${esc(b.bank)}<div class="sub">${esc(b.type)}</div></td><td>${esc(b.ifsc)}</td><td>${esc(b.acc)}</td><td>${b.refund ? '✓' : ''}</td></tr>`).join('')}</table>` : '<div class="sub">No bank details yet.</div>'}

    <div class="card" style="margin-top:12px"><h2>Assessee profile</h2><div class="setf">

  }
  /* 🧾 Tax documents: Form 16, salary slips, 26AS / AIS, capital gains, interest certificates — PDFs are unlocked on this device */

      <div class="setf"><label class="sub">Document type<select id="tdKind">${[['auto', 'Detect automatically'], ['salary_slip', 'Salary slip(s)'], ['form16', 'Form 16'], ['form26as', 'Form 26AS'], ['ais', 'AIS / TIS'], ['capital_gains', 'Capital-gains statement'], ['interest_certificate', 'Interest certificate']].map(o => `<option value="${o[0]}">${o[1]}</option>`).join('')}</select></label>

      ${slips.length ? `<h3 style="font-size:15px;margin-top:12px">Salary slips — ${esc(t.label)} (${slips.length})</h3><div class="tbl-wrap"><table class="tbl"><tr><th>Month</th><th>Employer</th><th class="n">Gross</th><th class="n">Basic</th><th class="n">HRA</th><th class="n">PF</th><th class="n">TDS</th><th class="n">Net</th><th>Bank</th><th></th></tr>
        ${slips.map(s => `<tr><td>${esc(s.month)}</td><td>${esc(s.employer)}</td><td class="n">${fa(s.gross)}</td><td class="n">${fa(s.basic)}</td><td class="n">${fa(s.hra)}</td><td class="n">${fa(s.pf)}</td><td class="n">${fa(s.tds)}</td><td class="n">${fa(s.net)}</td>
          <td>${s.matched ? '<span class="ok">✓</span>' : '<span class="sub">not found</span>'}</td><td>${s.file ? `<a href="${esc(s.file)}" target="_blank" rel="noopener">📎</a>` : ''} <a href="#" onclick="delSlip(${s.row});return false">✕</a></td></tr>`).join('')}
        <tr class="tot"><td>Total</td><td></td><td class="n">${fa(agg.gross)}</td><td class="n">${fa(agg.basic)}</td><td class="n">${fa(agg.hra)}</td><td class="n">${fa(agg.pf)}</td><td class="n">${fa(agg.tds)}</td><td class="n">${fa(agg.net)}</td><td></td><td></td></tr></table></div>
        <div class="hint">Slips feed gross salary, TDS, professional tax, EPF (80C) and the HRA calculation (exemption now ${fa(t.heads.salary.hra)}). Missing months: ${(() => { const have = slips.map(s => s.month), miss = []; for (let i = 0; i < 12; i++) { const d = new Date(CA.fy, 3 + i, 1); if (d > new Date()) break; const k = ym(d); if (have.indexOf(k) < 0) miss.push(d.toLocaleDateString('en-IN', { month: 'short' })); } return miss.length ? miss.join(', ') : 'none 🎉'; })()}.</div>` : ''}
    </div>`;

  async function taxDocs(files) {
    const kind = (document.getElementById('tdKind') || {}).value || 'auto', pw = (document.getElementById('tdPw') || {}).value || '';
    for (const f of files) {
      const row = { name: f.name, status: 'busy', msg: 'Reading…' };
      TDLOG = [row].concat(TDLOG).slice(0, 12); render();
      try {
        if (f.size > 15e6) throw new Error('File is above 15 MB');
        let text = '', b64 = '', mime = f.type || '';
        if (/pdf$/i.test(mime) || /\.pdf$/i.test(f.name)) {
          const pages = await pdfPages(new Uint8Array(await f.arrayBuffer()), pw);
          text = pages.map((p, i) => '--- Page ' + (i + 1) + ' ---\n' + p.text).join('\n');
          if (text.replace(/\s|-|Page|\d/g, '').length < pages.length * 40) { text = ''; b64 = await pageToJpeg(pages[0].page); mime = 'image/jpeg'; }
          else b64 = f.size < 8e6 ? await readB64(f) : '';
        } else b64 = await readB64(f);
        const res = await apiCall('caDoc', { name: f.name, mime: mime || 'application/pdf', b64: b64, text: text, kind: kind, fy: CA.fy });
        row.status = 'ok'; row.msg = res.msg; if (res.ca && Number(res.ca.fy) === Number(CA.fy)) CA = res.ca;
      } catch (e) { row.status = 'err'; row.msg = errText(e); }
      render();
    }
  }

  /* Bank details — BankDetails sheet. Numbers stay masked on the server unless the vault PIN is given (kept only for this browser session). */
  let VAULT = { hasPin: false };
  function vpin() { try { return sessionStorage.getItem('kgmp_vpin') || ''; } catch (e) { return ''; } }
  function setVpin(p) { try { if (p) sessionStorage.setItem('kgmp_vpin', p); else sessionStorage.removeItem('kgmp_vpin'); } catch (e) {} }
  function loadBanks(cb) {
    apiCall('banks', { pin: vpin() }).then(res => { BANKS = res.banks || []; VAULT = res.vault || VAULT; cb && cb(); })
      .catch(e => { if (/PIN/i.test(errText(e))) setVpin(''); BANKS = BANKS || []; showVibe(errText(e), null, 'Vault'); cb && cb(); });
  }
  function cBank() {
    if (!BANKS) { loadBanks(() => { if (MODE === 'ca' && CATAB === 'ca_bank') render(); }); return '<div class="loader"><b>🏦</b>Loading bank details…</div>'; }
    return '<div class="card" style="margin-top:12px">' + bankHtml() + '</div>';

      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><input id="vpNew" type="password" inputmode="numeric" maxlength="8" placeholder="New PIN (4–8 digits)" style="max-width:200px">

      <a href="#" onclick="vaultChangePin();return false">Change PIN</a> · <a href="#" onclick="rotateLink();return false">New secret link</a></div>`;
    return `<div class="card" style="background:var(--card2);margin-bottom:10px"><b>🔒 Vault locked</b><div class="sub">Enter your PIN to see full numbers or edit.</div>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><input id="vpIn" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" style="max-width:160px" onkeydown="if(event.key==='Enter')vaultUnlock()">

  function vaultChangePin() {

  function rotateLink() {
    if (!confirm('Create a new secret app link? The old link stops working everywhere (phones, bookmarks). This device switches to the new one automatically; on other devices use /dash in Telegram.')) return;

  function bankHtml() {

        <div class="mono">A/c ${esc(b.accountNo || '—')}${b.open && b.accountNo ? ` <button class="ghost" style="padding:1px 7px" onclick="copyTxt('${jsq(b.accountNo)}')">Copy</button>` : ''}</div>

  /* Analytics */
  function cAn() {
    const a = CA.analytics, R = a.ratios, ms = a.months;
    const catMax = Math.max(1, ...a.cats.map(c => Math.max(...c.months)));
    const cell = v => `<td class="n" style="background:rgba(37,99,235,${Math.max(0, Math.min(.5, v / catMax * .5)).toFixed(3)})">${v ? fa(v) : ''}</td>`;
    const wdMax = Math.max(1, ...a.weekday.map(w => w.amt));
    const yy = (c, p) => (p ? fpc((c - p) / p) : '—');
    return `<div class="stats">${cstat('Savings rate', fpc(R.savingsRate))}${cstat('Investment rate', fpc(R.investRate))}${cstat('EMI to income', fpc(R.emiToIncome))}${cstat('Fixed costs share', fpc(R.fixedShare))}
      ${cstat('Discretionary share', fpc(R.discretionaryShare))}${cstat('Spent on credit', fpc(R.cardShare))}${cstat('Avg monthly spend', fa(R.avgMonthly))}${cstat('Avg daily spend', fa(R.avgDaily))}</div>
    <div class="card" style="margin-top:12px"><h2>Month-wise</h2><div class="tbl-wrap"><table class="tbl"><tr><th>Month</th><th class="n">Income</th><th class="n">Expenditure</th><th class="n">Saved</th><th class="n">Rate</th><th class="n">Invested</th><th class="n">Tax paid</th><th class="n">Entries</th></tr>
      ${ms.map(m => `<tr ${m.future ? 'style="opacity:.45"' : ''}><td style="white-space:nowrap">${esc(m.label)}</td><td class="n">${fa(m.inc)}</td><td class="n">${fa(m.exp)}</td><td class="n ${m.save < 0 ? 'neg' : ''}">${fa(m.save)}</td><td class="n">${fpc(m.rate)}</td><td class="n">${fa(m.inv)}</td><td class="n">${fa(m.tax)}</td><td class="n">${m.n}</td></tr>`).join('')}
      <tr class="tot"><td>Total</td><td class="n">${fa(a.totals.inc)}</td><td class="n">${fa(a.totals.exp)}</td><td class="n">${fa(a.totals.save)}</td><td class="n">${fpc(R.savingsRate)}</td><td class="n">${fa(a.totals.inv)}</td><td class="n">${fa(a.totals.tax)}</td><td class="n">${ms.reduce((s, m) => s + m.n, 0)}</td></tr></table></div></div>

      <div class="card"><h2>Recurring payments (3+ months)</h2><table class="tbl">${a.recurring.map(x => `<tr><td>${esc(x.name)}<div class="sub">${x.months} months · avg ${fa(x.avg)}</div></td><td class="n">${fa(x.amt)}</td></tr>`).join('') || '<tr><td class="sub">None detected yet</td></tr>'}</table></div>
      <div class="card"><h2>Largest payments</h2><table class="tbl">${a.biggest.slice(0, 10).map(x => `<tr><td>${fd2(x.date)}<div class="sub">${esc(x.head)}${x.note ? ' · ' + esc(x.note) : ''}</div></td><td class="n">${fa(x.amt)}</td></tr>`).join('') || '<tr><td class="sub">—</td></tr>'}</table></div>

        <tr class="sec"><td>Total income</td><td class="n">${fa(a.totals.inc)}</td><td class="n">${fa(a.yoy.inc)}</td><td class="n">${yy(a.totals.inc, a.yoy.inc)}</td></tr>
        <tr class="sec"><td>Total expenditure</td><td class="n">${fa(a.totals.exp)}</td><td class="n">${fa(a.yoy.exp)}</td><td class="n">${yy(a.totals.exp, a.yoy.exp)}</td></tr>
        ${a.yoy.rows.slice(0, 15).map(x => `<tr><td>${esc(x.name)}</td><td class="n">${fa(x.cur)}</td><td class="n">${fa(x.prev)}</td><td class="n ${x.change > 0 ? 'neg' : 'pos'}">${fpc(x.change)}</td></tr>`).join('')}</table>`
