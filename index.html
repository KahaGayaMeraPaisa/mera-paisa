<style>

  function apiCall(action, data) {

  function loadPdfJs() {
    if (PDFJS) return Promise.resolve(PDFJS);
    const base = 'https:' + '/' + '/cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    return new Promise((ok, bad) => {
      const s = document.createElement('script');
      s.src = base + 'pdf.min.js';
      s.onload = () => { PDFJS = window.pdfjsLib; PDFJS.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js'; ok(PDFJS); };
      s.onerror = () => bad(new Error('PDF reader load nahi hua — internet check karo 📶'));
      document.head.appendChild(s);
    });
  }
  async function pdfPages(buf, pw) {
    const lib = await loadPdfJs();
    let doc;
    try { doc = await lib.getDocument({ data: buf, password: pw || undefined }).promise; }
    catch (e) {
      if (e && e.name === 'PasswordException') throw new Error(pw ? 'PDF password galat hai 🔒 Dobara try karo' : 'Ye PDF password-protected hai 🔒 Upar password daalo (aksar DOB, customer ID ya PAN ka hissa hota hai)');
      throw e;
    }
    const pages = [];
    for (let p = 1; p <= Math.min(doc.numPages, 40); p++) {
      const page = await doc.getPage(p);
      const tc = await page.getTextContent();
      const rows = {};
      tc.items.forEach(it => { if (!it.str || !it.str.trim()) return; const y = Math.round(it.transform[5] / 3); (rows[y] = rows[y] || []).push({ x: it.transform[4], s: it.str }); });
      const lines = Object.keys(rows).map(Number).sort((a, b) => b - a).map(y => rows[y].sort((a, b) => a.x - b.x).map(o => o.s).join('  ').replace(/\s{3,}/g, '  ').trim());
      pages.push({ text: lines.join('\n'), page });
    }
    return pages;
  }
  async function pageToJpeg(page) {
    const vp = page.getViewport({ scale: 1.6 });
    const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    return c.toDataURL('image/jpeg', 0.8).split(',')[1];
  }
  function txtB64(s) { return btoa(unescape(encodeURIComponent(s))); }
  async function importStatement(file) {
    if (!file) return;
    const acc = (document.getElementById('stAcc') || {}).value || '', pw = (document.getElementById('stPw') || {}).value || '';
    const row = { name: file.name, status: 'busy', msg: 'Statement padh rahe hain… ' + pick(D.lines.scanWait) };
    STMTLOG = [row].concat(STMTLOG).slice(0, 10); render();
    const upd = m => { row.msg = m; if (TAB === 'jaadu') render(); };
    const tot = { found: 0, added: 0, dup: 0, spent: 0, income: 0, account: acc, fix: null };
    const send = async (payload, label) => {
      upd('🪄 ' + label + ' — AI entries padh raha hai…');
      const r = await apiCall('import', Object.assign({ account: acc, statement: true, light: true, hint: 'bank/card statement' }, payload));
      const s = r.stats || {};
      ['found', 'added', 'dup', 'spent', 'income'].forEach(k => { tot[k] += s[k] || 0; });
      if (s.account) tot.account = s.account;
      if (r.fix) tot.fix = r.fix;
    };
    try {
      if (file.size > 15e6) throw new Error('File 15MB se badi hai 🐘');
      if (!(/pdf$/i.test(file.type) || /\.pdf$/i.test(file.name))) {
        await send({ name: file.name, mime: file.type, b64: await readB64(file) }, file.name);
      } else {
        upd('🔓 PDF khol rahe hain…');
        const pages = await pdfPages(new Uint8Array(await file.arrayBuffer()), pw);
        const chars = pages.reduce((n, p) => n + p.text.length, 0);
        if (chars > pages.length * 80) {
          const chunks = []; let cur = '', cnt = 0;
          pages.forEach((p, i) => {
            const t = '--- Page ' + (i + 1) + ' ---\n' + p.text + '\n';
            if (cur && (cur.length + t.length > 9000 || cnt >= 3)) { chunks.push(cur); cur = ''; cnt = 0; }
            cur += t; cnt++;
          });
          if (cur) chunks.push(cur);
          for (let i = 0; i < chunks.length; i++) {
            await send({ name: file.name + '.part' + (i + 1) + '.txt', mime: 'text/plain', b64: txtB64(chunks[i]), hint: 'bank/card statement, part ' + (i + 1) + ' of ' + chunks.length }, 'Part ' + (i + 1) + '/' + chunks.length);
          }
        } else {
          for (let i = 0; i < Math.min(pages.length, 12); i++) {
            await send({ name: file.name + '.p' + (i + 1) + '.jpg', mime: 'image/jpeg', b64: await pageToJpeg(pages[i].page), hint: 'scanned bank/card statement page ' + (i + 1) }, 'Page ' + (i + 1) + '/' + pages.length);
          }
        }
      }
      applyRes(await apiCall('dashboard'));
      row.status = 'ok'; row.fix = tot.fix;
      row.msg = '🏦 ' + (tot.account || 'Statement') + '\n🔍 ' + tot.found + ' entries mili · ✅ ' + tot.added + ' naye · ♻️ ' + tot.dup + ' pehle se the\n🔻 Kharcha ' + inr(tot.spent) + ' · 🟢 Aaya ' + inr(tot.income);
      showSticker({ e: '🏦', t: 'Statement imported' }); rain(['📄', '✨', '💸'], 20);
    } catch (e) { row.status = 'err'; row.msg = errText(e); }
    render();
  }

  async function makeStory() {
    const w = D.wrapped[WMONTH], a = D.aura;
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1920;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 1080, 1920);
    g.addColorStop(0, '#7c3aed'); g.addColorStop(.55, '#ec4899'); g.addColorStop(1, '#f59e0b');
    x.fillStyle = g; x.fillRect(0, 0, 1080, 1920);
    x.globalAlpha = .13; x.fillStyle = '#fff';
    [[930, 220, 270], [110, 1480, 330], [1000, 1700, 190]].forEach(([cx, cy, r]) => { x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill(); });
    x.globalAlpha = 1;
    try { await Promise.all([document.fonts.load('90px Anton'), document.fonts.load('700 40px "Space Grotesk"')]); } catch (e) {}
    const fit = (txt, max, size, font) => { let s = size; do { x.font = font.replace('$', s); s -= 4; } while (x.measureText(txt).width > max && s > 20); };
    const rr = (X, Y, W, H, R) => { x.beginPath(); x.moveTo(X + R, Y); x.arcTo(X + W, Y, X + W, Y + H, R); x.arcTo(X + W, Y + H, X, Y + H, R); x.arcTo(X, Y + H, X, Y, R); x.arcTo(X, Y, X + W, Y, R); x.closePath(); };
    x.textAlign = 'center'; x.fillStyle = '#fff';
    x.font = '700 42px "Space Grotesk", sans-serif'; x.fillText('💸 KAHA GAYA MERA PAISA', 540, 140);
    fit('PAISA WRAPPED', 960, 128, '$px Anton, Impact, sans-serif'); x.fillText('PAISA WRAPPED', 540, 290);
    x.font = '600 46px "Space Grotesk", sans-serif'; x.fillText(w.label.toUpperCase(), 540, 360);
    x.fillStyle = 'rgba(255,255,255,.18)'; rr(70, 420, 940, 290, 44); x.fill();
    x.fillStyle = '#fff'; x.font = '600 40px "Space Grotesk", sans-serif'; x.fillText('Main hoon…', 540, 495);
    fit(w.persona.title, 880, 92, '$px Anton, Impact, sans-serif'); x.fillText(w.persona.title, 540, 610);
    fit(w.persona.line, 860, 36, '500 $px "Space Grotesk", sans-serif'); x.fillText(w.persona.line, 540, 670);
    const rows = [['🔻 Kharcha', inrS(w.expense)], ['👑 Top', w.top ? w.top.name + ' · ' + pct(w.top.share) : '—'],
      ['💘 Crush', w.topMerchant ? w.topMerchant.name + ' ×' + w.topMerchant.count : '—'], ['💰 Saved', w.savingsRate !== null ? pct(w.savingsRate) : '—'],
      ['🗿 No-spend days', String(w.noSpendDays)], [a.emoji + ' Aura', a.score.toLocaleString('en-IN') + ' · ' + a.tier]];
    rows.forEach((r, i) => {
      const y = 790 + i * 118;
      x.fillStyle = 'rgba(0,0,0,.16)'; rr(90, y - 70, 900, 98, 30); x.fill();
      x.fillStyle = '#fff'; x.textAlign = 'left'; x.font = '600 40px "Space Grotesk", sans-serif'; x.fillText(r[0], 130, y);
      x.textAlign = 'right'; fit(r[1], 520, 48, '$px Anton, Impact, sans-serif'); x.fillText(r[1], 950, y);
    });
    x.textAlign = 'center';
    const sticker = (e, t, cx, cy, rot) => {
      x.save(); x.translate(cx, cy); x.rotate(rot * Math.PI / 180);
      x.font = '150px sans-serif'; x.shadowColor = 'rgba(0,0,0,.3)'; x.shadowBlur = 20; x.fillText(e, 0, -10); x.shadowBlur = 0;
      x.font = '56px Anton, Impact, sans-serif'; const tw = x.measureText(t).width + 50;
      x.fillStyle = '#111'; rr(-tw / 2, 20, tw, 84, 20); x.fill(); x.strokeStyle = '#fff'; x.lineWidth = 6; x.stroke();
      x.fillStyle = '#fff'; x.fillText(t, 0, 84); x.restore();
    };
    const st = storyStickers(w);
    sticker(st[0][0], st[0][1], 300, 1590, -9);
    sticker(st[1][0], st[1][1], 780, 1660, 8);
    x.fillStyle = 'rgba(255,255,255,.9)'; x.font = '600 34px "Space Grotesk", sans-serif'; x.fillText('Apna bana → Kaha Gaya Mera Paisa 💸', 540, 1860);
    return c;
  }

  function quick() {

    const fx = () => {
      const isIn = /^\s*(\+|income|got|received|salary|took|borrowed)/i.test(t);

  function saveTx(e, id) {
    e.preventDefault(); buzz();
    const d = formData(e.target);
    if (id) { d.id = id; call('updateTx', d, closeModal); }
    else call('addTx', d, () => { e.target.reset(); rain(d.type === 'income' ? ['🤑', '💰'] : ['💸', '🥲'], 18); });
  }
  function editTx(id) {
    const t = D.recent.find(x => x.id === id);
    if (!t) return;
    openModal(`<h3>✏️ Edit kharcha</h3><div class="sub" style="margin-bottom:10px">"History likhne wale history badal bhi sakte hain" 🖊️</div>${txForm(t)}`);
  }
  function delTx(id) { if (confirm('Pakka delete? "Mitti pao"?')) call('deleteTx', { id }, closeModal); }
  function payDue(name) { if (confirm('"' + name + '" paid mark karein aur log karein?')) call('payDue', { name }, () => rain(['✅', '🎉', '😌'], 18)); }
  function saveGoal(e, name, saved, target) {
    e.preventDefault(); buzz();
    const amt = Number(new FormData(e.target).get('amount'));
    if (!amt) return;
    call('saveGoal', { name, amount: amt }, () => {
      if (saved < target && saved + amt >= target) rain(['🎉', '🏆', '✨', '🎊', '🥳'], 60); else rain(['🪙', '✨'], 14);
    });
  }
  function splitSubmit(e) {
    e.preventDefault(); buzz();
    const d = formData(e.target);
    const ppl = d.people.split(/[,&]+/).map(s => s.trim()).filter(Boolean).join(', ');
    call('quick', { text: `split ${d.amount} ${d.note || ''} ${d.account} with ${ppl}` }, () => { e.target.reset(); rain(['🍕', '➗', '🤝'], 18); });
  }
  function udhaarSubmit(e) {
    e.preventDefault(); buzz();
    const d = formData(e.target);
    call('addTx', { type: d.type, amount: d.amount, to: d.to, account: D.defaultAccount }, () => e.target.reset());
  }
  function openModal(html) { document.getElementById('modalBox').innerHTML = html; document.getElementById('modal').classList.add('show'); }
  function closeModal() { document.getElementById('modal').classList.remove('show'); }

  /* ── boot ── */
  applyTheme();
  document.getElementById('vibeBtn').style.opacity = VIBE ? 1 : .4;
  document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') quick(); });
  let ex = 0;
  setInterval(() => { const q = document.getElementById('q'); if (document.activeElement !== q) q.placeholder = EXAMPLES[ex++ % EXAMPLES.length]; }, 2800);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  const params = new URLSearchParams(location.search);
  const wantTab = params.get('tab') || store.get('tab', 'home');
  TAB = TABS.some(t => t[0] === wantTab) ? wantTab : 'home';
  renderNav(); renderQueuePill();

  function connectView(err) {
    document.getElementById('app').innerHTML = `<div class="card hero" style="margin-top:12px">${stk('🔗', 'Step 1', -6, 'right:14px;top:14px', 'dark')}
      <div class="l">Welcome, main character ✨</div><div class="nw" style="font-size:26px">App ko apne hisaab se connect karo</div>
      <div class="row2">Ek baar ka kaam. Phir hamesha ke liye ✅</div></div>
      <div class="card" style="margin-top:12px"><h2>🔗 Connect</h2>
        <div style="margin-bottom:8px">Telegram bot pe <b>/dash</b> bhej → <b>"Install / open the app"</b> dabao — auto connect ho jayega.<br><span class="sub">Ya secret link yahan paste karo (bot ke /dash message mein hai):</span></div>
        <input id="link" placeholder="script.google.com/macros/s/…/exec?k=…" autocomplete="off">
        <button class="btn" style="margin-top:8px;width:100%" onclick="connect(document.getElementById('link').value)">Connect karo 🚀</button>
        ${err ? `<div class="hint neg">⚠️ ${esc(err)}</div>` : ''}</div>`;
  }
  function connect(link) {
    link = String(link || '').trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\/.+[?&]k=/.test(link)) { connectView('Ye link sahi nahi lag raha. /dash wala "script.google.com…?k=…" link chahiye.'); return; }
    store.set('api', link);
    document.getElementById('app').innerHTML = '<div class="loader"><b>🔗</b>Connect ho raha hai…</div>';
    boot(true);
  }
  async function receiveShared() {
    if (!params.get('share') || !('caches' in window)) return;
    history.replaceState(null, '', location.pathname);
    const c = await caches.open('kgmp-share');
    const keys = await c.keys();
    const files = [];
    for (const k of keys) {
      const r = await c.match(k);
      const kind = r.headers.get('x-kind');
      if (kind === 'text') { const txt = await r.text(); if (txt.trim()) { document.getElementById('q').value = txt.trim().slice(0, 500); showVibe('Shared text aaya 📩 Add dabao ya edit karo', '📩', 'Share'); } }
      else { const b = await r.blob(); files.push(new File([b], decodeURIComponent(r.headers.get('x-name') || 'shared'), { type: b.type })); }
      await c.delete(k);
    }
    if (files.length) { go('jaadu'); pickFiles(files); }
  }
  function boot(fresh) {
    apiCall('dashboard').then(res => {
      window.__fromCache = false;
      D = res.data; saveCache(); render();
      if (fresh) { showSticker({ e: '🔗', t: 'Connected. Slay!' }); rain(['✨', '💸', '🎉'], 30); }
      else if (VIBE) { setTimeout(() => showVibe(pick(D.lines.sections[TAB]), null, TAB_TITLES[TAB]), 300); if (Math.random() < .35) setTimeout(() => sticker('welcome'), 900); }
      flushQueue(); receiveShared();
    }).catch(e => {
      if (!IS_GAS && !store.get('api', '')) { connectView(); return; }
      if (!IS_GAS && fresh) { store.set('api', ''); connectView(errText(e)); return; }
      if (D) { showVibe('Offline ho shayad 📴 Purana data dikha rahe hain', '📴', 'Offline'); return; }
      document.getElementById('app').innerHTML = '<div class="loader"><b>😵</b>' + esc(errText(e)) + '</div>';
    });
  }
  if (!IS_GAS) window.addEventListener('hashchange', () => {
    const h = location.hash.match(/^#connect=(.+)$/);
    if (h) { history.replaceState(null, '', location.pathname + location.search); connect(decodeURIComponent(h[1])); }
  });
  if (!IS_GAS) {
    const h = location.hash.match(/^#connect=(.+)$/);
    if (h) { history.replaceState(null, '', location.pathname + location.search); connect(decodeURIComponent(h[1])); }
    else if (!store.get('api', '')) connectView();
    else {
      try { const c = localStorage.getItem('kgmp_last'); if (c) { D = JSON.parse(c); window.__fromCache = true; render(); } } catch (e) {}
      boot(false);
    }
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
    if (!IS_STANDALONE) setTimeout(() => { if (!deferredInstall) document.getElementById('installBtn').style.display = ''; }, 2500);
  } else boot(false);
</script>
</body>
</html>
